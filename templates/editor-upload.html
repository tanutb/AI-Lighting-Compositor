<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload for Editor - AI Lighting Compositor</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v={{ version }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1e1e1e;
            color: #ccc;
        }
        .upload-container {
            background: #252526;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #3e3e42;
            width: 400px;
            max-width: 90%;
        }
        .upload-box {
            border: 2px dashed #444;
            border-radius: 6px;
            padding: 40px 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-box:hover, .upload-box.drag-over {
            border-color: #007fd4;
            background: rgba(0, 127, 212, 0.05);
        }
        .upload-icon {
            font-size: 48px;
            color: #666;
            margin-bottom: 15px;
        }
        .btn-upload {
            background: #007fd4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }
        .btn-upload:hover {
            background: #0060a0;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 12px;
        }
        .back-link:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h1 style="color: white; font-size: 20px; font-weight: 500;">Open Image in Editor</h1>
        <p style="font-size: 13px; color: #888; margin-top: 5px;">Select an image to start editing</p>
        
        <form id="upload-form" action="/api/editor-upload" method="post" enctype="multipart/form-data">
            <div class="upload-box" id="drop-area">
                <div class="upload-icon">📁</div>
                <div style="font-weight: 500; color: #eee;">Click or Drop Image</div>
                <div style="font-size: 12px; color: #777; margin-top: 5px;">Supports PNG, JPG, WEBP</div>
            </div>
            <input type="file" name="file" id="file-input" accept="image/*" style="display: none;">
        </form>

        <a href="/" class="back-link">← Back to Workspace</a>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const form = document.getElementById('upload-form');

        dropArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleFiles(fileInput.files);
            }
        });

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.classList.add('drag-over');
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.classList.remove('drag-over');
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFiles(files);
            }
        });

        function handleFiles(files) {
            const file = files[0];
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }
            
            // Show loading state
            dropArea.innerHTML = '<div class="upload-icon">⏳</div><div>Uploading...</div>';
            form.submit();
        }
    </script>
</body>
</html>
